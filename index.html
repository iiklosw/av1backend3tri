<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários Kennedy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            vertical-align: top;
        }
        th {
            background-color: hsl(301, 100%, 87%);
            color: white;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        li:last-child {
            border-bottom: none;
        }
        button {
            background-color: #f9b6e6;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #bd448e;
        }
        .btn-todos {
            display: block;
            margin: 15px auto;
            background-color: #fc9fe8;
            font-size: 16px;
        }
        .btn-todos:hover {
            background-color: #fc9fe8;
        }
    </style>
</head>
<body>
    <header>
        <h1>Horário de Aulas - Colégio Kennedy</h1>
    </header>

    <main>
        <button class="btn-todos" onclick="carregar_semana_toda()">Carregar Toda a Semana</button>

        <table>
            <thead>
                <tr>
                    <th>Horário / Dia</th>
                    <th>Segunda-feira</th>
                    <th>Terça-feira</th>
                    <th>Quarta-feira</th>
                    <th>Quinta-feira</th>
                    <th>Sexta-feira</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <ul>
                            <li>7h20</li>
                            <li>8h10</li>
                            <li>9h00</li>
                            <li>10h05</li>
                            <li>10h55</li>
                            <li>11h45</li>
                        </ul>
                    </td>
                    <td id="segunda"> </td>
                    <td id="terça"> </td>
                    <td id="quarta"> </td>
                    <td id="quinta"> </td>
                    <td id="sexta"> </td>
                </tr>
                <tr>
                    <td></td>
                    <td> <button onclick="carregar_horario('segunda')">Carregar</button> </td>
                    <td> <button onclick="carregar_horario('terça')">Carregar</button> </td>
                    <td> <button onclick="carregar_horario('quarta')">Carregar</button> </td>
                    <td> <button onclick="carregar_horario('quinta')">Carregar</button> </td>
                    <td> <button onclick="carregar_horario('sexta')">Carregar</button> </td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer></footer>   

    <script>
        async function carregar_horario(dia){
            const coluna_dia = document.getElementById(dia)
            try {
                const link = "http://localhost:3000/horario/" + dia
                const consulta_api = await fetch(link)
                if(consulta_api.ok) {
                    const aulas_dia = await consulta_api.json()
                    if (aulas_dia.length == 0){
                        coluna_dia.innerHTML = "Nenhuma aula cadastrada!"
                    } else {
                        console.log(aulas_dia)
                        let html = "<ul>"
                        aulas_dia.forEach((aula) => {
                            html += "<li>" + aula.componente + "</li>"
                        })
                        html += "</ul>"
                        coluna_dia.innerHTML = html
                    }
                }
            } catch (erro) {
                alert(erro)
                coluna_dia.innerHTML = "Erro ao carregar horários!"
            }
        }

        function carregar_semana_toda() {
            const dias = ['segunda', 'terça', 'quarta', 'quinta', 'sexta'];
            dias.forEach(dia => carregar_horario(dia));
        }
    </script>
</body>
</html>
